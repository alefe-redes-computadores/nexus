name: Build APK Nexus

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências
        run: npm install

      - name: Build do Next.js (export para Capacitor)
        run: |
          echo "export default { output: 'export', eslint: { ignoreDuringBuilds: true }, typescript: { ignoreBuildErrors: true } };" > next.config.mjs
          npm run build

      - name: Sincronizar e Preparar Android (Com Login Supabase)
        run: |
          rm -rf android
          npx cap add android
          
          # Injeta o esquema de Deep Link do Supabase para o redirecionamento de login funcionar
          sed -i 's/<\/activity>/<intent-filter android:label="nexus_auth"><action android:name="android.intent.action.VIEW" \/><category android:name="android.intent.category.DEFAULT" \/><category android:name="android.intent.category.BROWSABLE" \/><data android:scheme="com.nexus.app" android:host="callback" \/><\/intent-filter><\/activity>/g' android/app/src/main/AndroidManifest.xml
          
          npx cap sync android
          
          # Copia o logo usado na tela de login para gerar os ícones nativos
          mkdir -p assets
          cp public/logo.png assets/icon.png || echo "Ícone não encontrado"
          cp public/logo.png assets/splash.png || echo "Splash não encontrada"
          
          # Gera os ícones e a tela de splash
          npx @capacitor/assets generate --android

      - name: Compilar APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
